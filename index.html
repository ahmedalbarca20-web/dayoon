<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#0f172a">

  <title>دفتر الديون</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css?v=21">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: "Tajawal", Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    input,
    textarea,
    button,
    select {
      font-family: inherit;
      font-size: 16px;
    }

    .hidden {
      display: none !important;
    }

    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: #0f172a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
    }

    .loading-screen.hidden {
      display: none !important;
    }

    .contract-banner {
      margin: 12px 0;
      padding: 14px 18px;
      border-radius: 14px;
      background: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }

    .contract-banner.expired {
      background: #fef2f2;
      color: #b91c1c;
      border-color: #fecaca;
    }

    .contract-banner.disabled {
      background: #fff7ed;
      color: #c2410c;
      border-color: #fed7aa;
    }

    .contract-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .contract-status {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .contract-status.active {
      background: #dcfce7;
      color: #166534;
    }

    .contract-status.disabled {
      background: #fee2e2;
      color: #991b1b;
    }

    .contract-status.expired {
      background: #ffedd5;
      color: #9a3412;
    }

    .office-card {
      cursor: default;
    }

    .office-contract {
      margin-top: 8px;
      font-size: 13px;
      color: #64748b;
    }

    .modal-content {
      max-height: 90vh;
      overflow-y: auto;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      background: white;
    }

    .form-group textarea {
      min-height: 90px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 650px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }

    .admin-contract-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    .btn-contract-on {
      background: #16a34a;
      color: white;
      border: 0;
    }

    .btn-contract-off {
      background: #dc2626;
      color: white;
      border: 0;
    }

    .login-message {
      margin-bottom: 12px;
    }
  </style>
</head>

<body>

  <!-- شاشة التحميل -->
  <div id="loadingScreen" class="loading-screen">
    جارٍ تحميل دفتر الديون...
  </div>


  <!-- =====================================================
       تسجيل الدخول
       ===================================================== -->

  <div id="loginView" class="login-view hidden">

    <div class="login-card">

      <div class="login-logo">

        <span class="logo-icon">📒</span>

        <h1>دفتر الديون</h1>

      </div>

      <p class="login-subtitle">
        سجّل دخولك للمتابعة
      </p>


      <div
        id="loginMessage"
        class="login-message hidden">
      </div>


      <form id="loginForm">

        <div class="form-group">

          <label>
            البريد الإلكتروني / اسم المستخدم
          </label>

          <input
            type="text"
            id="loginEmail"
            placeholder="البريد أو اسم المستخدم"
            autocomplete="username"
            required
          >

        </div>


        <div class="form-group">

          <label>
            كلمة المرور
          </label>

          <input
            type="password"
            id="loginPassword"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          type="submit"
          class="btn btn-primary login-btn"
          id="loginBtn">

          دخول

        </button>

      </form>


      <p
        class="login-hint"
        id="loginHint">
      </p>


      <div
        class="conn-status"
        id="connStatus">

        <span
          class="conn-dot"
          id="connDot">
        </span>

        <span id="connText">
          جارٍ الفحص...
        </span>

      </div>

    </div>

  </div>


  <!-- =====================================================
       لوحة الأدمن
       ===================================================== -->

  <div id="adminView" class="hidden">

    <header class="app-header">

      <div class="container header-inner">

        <div class="logo">

          <span class="logo-icon">
            ⚙️
          </span>

          <div>

            <h1>
              لوحة الإدارة
            </h1>

            <span class="subtitle">
              إدارة المكاتب والعقود
            </span>

          </div>

        </div>


        <div class="header-actions">

          <div class="header-stats">

            <div class="stat-box">

              <span class="stat-label">
                عدد المكاتب
              </span>

              <span
                class="stat-value"
                id="officesCount">
                0
              </span>

            </div>

          </div>


          <button
            class="btn btn-logout"
            id="adminLogoutBtn">

            خروج

          </button>

        </div>

      </div>

    </header>


    <main class="container">

      <div class="toolbar">

        <div class="search-box">

          <input
            type="text"
            id="officeSearch"
            placeholder="ابحث عن مكتب..."
          >

        </div>


        <button
          class="btn btn-primary"
          id="addOfficeBtn">

          + إضافة مكتب

        </button>

      </div>


      <div
        id="officesList"
        class="people-list">
      </div>


      <div
        id="officesEmpty"
        class="empty-state hidden">

        <p>
          لا يوجد مكاتب بعد.
        </p>

      </div>

    </main>

  </div>


  <!-- =====================================================
       تطبيق المكتب
       ===================================================== -->

  <div id="appView" class="hidden">

    <header class="app-header">

      <div class="container header-inner">

        <div class="logo">

          <span class="logo-icon">
            📒
          </span>

          <div>

            <h1 id="appTitle">
              دفتر الديون
            </h1>

            <span
              class="subtitle"
              id="appSubtitle">
              إدارة الديون بسهولة
            </span>

          </div>

        </div>


        <div class="header-actions">

          <div class="header-stats">

            <div class="stat-box">

              <span class="stat-label">
                إجمالي المستحق
              </span>

              <span
                class="stat-value"
                id="totalDebt">
                0
              </span>

            </div>


            <div class="stat-box">

              <span class="stat-label">
                عدد الأشخاص
              </span>

              <span
                class="stat-value"
                id="peopleCount">
                0
              </span>

            </div>

          </div>


          <button
            class="btn btn-ghost hidden"
            id="backToAdminBtn">

            → لوحة الإدارة

          </button>


          <button
            class="btn btn-logout"
            id="logoutBtn">

            خروج

          </button>

        </div>

      </div>


      <div class="container">

        <div
          id="contractBanner"
          class="contract-banner hidden">
        </div>

      </div>

    </header>


    <main class="container">

      <!-- قائمة الأشخاص -->

      <section
        id="peopleView"
        class="view">

        <div class="toolbar">

          <div class="search-box">

            <input
              type="text"
              id="searchInput"
              placeholder="ابحث بالاسم أو رقم الهاتف..."
            >

          </div>


          <button
            class="btn btn-ghost"
            id="exportBtn">

            ⬇ تصدير نسخة

          </button>


          <button
            class="btn btn-ghost"
            id="importBtn">

            ⬆ استيراد نسخة

          </button>


          <button
            class="btn btn-primary"
            id="addPersonBtn">

            + إضافة شخص

          </button>

        </div>


        <input
          type="file"
          id="importFile"
          accept=".json"
          class="hidden"
        >


        <div
          id="peopleList"
          class="people-list">
        </div>


        <div
          id="emptyState"
          class="empty-state hidden">

          <p>
            لا يوجد أشخاص بعد.
          </p>

        </div>

      </section>


      <!-- صفحة الشخص -->

      <section
        id="personView"
        class="view hidden">

        <div class="person-header">

          <button
            class="btn btn-ghost"
            id="backBtn">

            → الرجوع للقائمة

          </button>

        </div>


        <div
          class="person-card"
          id="personCard">
        </div>


        <div class="actions-bar">

          <button
            class="btn btn-success"
            id="payBtn">

            تسديد

          </button>


          <button
            class="btn btn-danger"
            id="purchaseBtn">

            شراء مباشر

          </button>


          <button
            class="btn btn-edit"
            id="editPersonBtn">

            تعديل بيانات الشخص

          </button>

        </div>


        <h2 class="section-title">

          سجل الحركات

          <span
            class="count-badge"
            id="txnCount">
            0
          </span>

        </h2>


        <div
          id="transactionsList"
          class="transactions-list">
        </div>

      </section>

    </main>

  </div>


  <!-- =====================================================
       Modal
       ===================================================== -->

  <div
    id="modal"
    class="modal hidden">

    <div class="modal-content">

      <div class="modal-header">

        <h3 id="modalTitle">
          عنوان
        </h3>

        <button
          class="modal-close"
          id="modalClose">

          ✕

        </button>

      </div>


      <div
        class="modal-body"
        id="modalBody">
      </div>

    </div>

  </div>


  <!-- =====================================================
       Supabase
       ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-config.js"></script>

  <script src="app.js?v=22"></script>


  <script>
    // لا تسمح لشاشة التحميل بالبقاء
    window.addEventListener("load", function () {

      const screen =
        document.getElementById("loadingScreen");

      if (screen) {
        screen.classList.add("hidden");
        screen.style.display = "none";
      }

    });
  </script>

</body>
</html>
