<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>دفتر الديون</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

  <!-- ========================================= -->
  <!-- LOADING -->
  <!-- ========================================= -->

  <div
    id="loadingScreen"
    class="loading-screen"
  >
    جارٍ تحميل دفتر الديون...
  </div>


  <!-- ========================================= -->
  <!-- LOGIN -->
  <!-- ========================================= -->

  <section
    id="loginPage"
    class="page"
  >

    <div class="login-box">

      <h1>
        دفتر الديون
      </h1>

      <p>
        تسجيل الدخول
      </p>

      <form id="loginForm">

        <label>
          البريد الإلكتروني
        </label>

        <input
          id="email"
          type="email"
          autocomplete="username"
          required
        >

        <label>
          كلمة المرور
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button
          type="submit"
        >
          تسجيل الدخول
        </button>

      </form>

      <div
        id="loginMessage"
        class="login-message"
      ></div>

    </div>

  </section>


  <!-- ========================================= -->
  <!-- ADMIN -->
  <!-- ========================================= -->

  <section
    id="adminPage"
    class="page hidden"
  >

    <header class="topbar">

      <div>
        <h1>
          لوحة تحكم الأدمن
        </h1>

        <p>
          إدارة المكاتب والحسابات
        </p>
      </div>

      <button
        type="button"
        data-action="logout"
      >
        تسجيل الخروج
      </button>

    </header>


    <main class="container">

      <!-- CREATE OFFICE -->

      <div class="panel">

        <h2>
          إنشاء حساب مكتب
        </h2>

        <p>
          يتم إنشاء حساب المكتب من الأدمن فقط.
        </p>

        <form
          id="createOfficeForm"
          class="form-grid"
        >

          <div>

            <label>
              اسم المكتب
            </label>

            <input
              id="officeNameInput"
              type="text"
              required
            >

          </div>


          <div>

            <label>
              البريد الإلكتروني
            </label>

            <input
              id="officeEmailInput"
              type="email"
              required
            >

          </div>


          <div>

            <label>
              كلمة المرور
            </label>

            <input
              id="officePasswordInput"
              type="password"
              minlength="6"
              required
            >

          </div>


          <div>

            <label>
              بداية العقد
            </label>

            <input
              id="officeContractStart"
              type="date"
            >

          </div>


          <div>

            <label>
              نهاية العقد
            </label>

            <input
              id="officeContractEnd"
              type="date"
            >

          </div>


          <div class="full">

            <button
              type="submit"
            >
              إنشاء حساب المكتب
            </button>

          </div>

        </form>

      </div>


      <!-- OFFICES -->

      <div class="panel">

        <h2>
          المكاتب
        </h2>

        <div
          id="officesList"
          class="cards"
        ></div>

      </div>

    </main>

  </section>


  <!-- ========================================= -->
  <!-- OFFICE -->
  <!-- ========================================= -->

  <section
    id="officePage"
    class="page hidden"
  >

    <header class="topbar">

      <div>

        <h1>
          دفتر الديون
        </h1>

        <p>
          <span id="officeName">
            المكتب
          </span>
        </p>

      </div>

      <button
        type="button"
        data-action="logout"
      >
        تسجيل الخروج
      </button>

    </header>


    <main class="container">

      <div class="panel">

        <h2>
          <span id="currentOfficeName">
            المكتب
          </span>
        </h2>

        <p>
          بيانات هذا المكتب معزولة عن باقي المكاتب.
        </p>

      </div>


      <!-- ADD PERSON -->

      <div class="panel">

        <h2>
          إضافة شخص
        </h2>

        <form
          id="personForm"
          class="form-grid"
        >

          <div>

            <label>
              الاسم
            </label>

            <input
              id="personNameInput"
              type="text"
              required
            >

          </div>


          <div>

            <label>
              رقم الهاتف
            </label>

            <input
              id="personPhoneInput"
              type="text"
            >

          </div>


          <div>

            <label>
              المبلغ
            </label>

            <input
              id="personAmountInput"
              type="number"
              step="0.01"
              value="0"
            >

          </div>


          <div>

            <label>
              ملاحظات
            </label>

            <input
              id="personNotesInput"
              type="text"
            >

          </div>


          <div class="full">

            <button
              type="submit"
            >
              إضافة
            </button>

          </div>

        </form>

      </div>


      <!-- PEOPLE -->

      <div class="panel">

        <h2>
          الأشخاص
        </h2>

        <div
          id="peopleList"
          class="cards"
        ></div>

      </div>

    </main>

  </section>


  <!-- ========================================= -->
  <!-- SUPABASE -->
  <!-- ========================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script
    src="supabase-config.js"
  ></script>

  <script
    src="app.js"
  ></script>

</body>

</html>
