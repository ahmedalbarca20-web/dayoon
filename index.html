<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#111827">

  <title>دفتر الديون</title>

  <link rel="stylesheet" href="style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- إعدادات Supabase الخاصة بك -->
  <script src="supabase-config.js"></script>
</head>

<body>

  <!-- ================= LOADING ================= -->

  <div id="loadingScreen" class="loading-screen">
    <div class="loading-card">
      <div class="spinner"></div>
      <div>جارٍ تحميل دفتر الديون...</div>
    </div>
  </div>


  <!-- ================= LOGIN ================= -->

  <section id="loginScreen" class="login-screen hidden">

    <div class="login-card">

      <div class="login-logo">📒</div>

      <h1>دفتر الديون</h1>

      <p class="login-subtitle">
        تسجيل الدخول
      </p>

      <form id="loginForm">

        <div class="field">
          <label for="loginEmail">
            البريد الإلكتروني
          </label>

          <input
            id="loginEmail"
            type="email"
            autocomplete="username"
            placeholder="البريد الإلكتروني"
            required
          >
        </div>

        <div class="field">
          <label for="loginPassword">
            كلمة المرور
          </label>

          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            placeholder="كلمة المرور"
            required
          >
        </div>

        <button
          type="submit"
          class="btn btn-primary login-btn"
        >
          تسجيل الدخول
        </button>

      </form>

      <div class="login-info">
        الحسابات يتم إنشاؤها من صفحة الإدارة فقط.
      </div>

    </div>

  </section>


  <!-- ================= APPLICATION ================= -->

  <section id="appScreen" class="app-screen hidden">

    <header class="app-header">

      <div class="brand">

        <div class="brand-icon">
          📒
        </div>

        <div>
          <h1>دفتر الديون</h1>
          <span>إدارة حسابات الزبائن</span>
        </div>

      </div>

      <button
        id="logoutBtn"
        class="logout-btn"
        type="button"
      >
        خروج
      </button>

    </header>


    <main class="dashboard">

      <div class="section-title">

        <div>
          <h2>الزبائن</h2>

          <p>
            الحسابات والحركات
          </p>
        </div>

        <button
          id="addPersonBtn"
          class="add-btn"
          type="button"
        >
          <b>+</b>
          إضافة شخص
        </button>

      </div>


      <!-- البحث -->

      <div class="search">

        <span>🔍</span>

        <input
          id="searchInput"
          type="search"
          placeholder="ابحث عن شخص..."
          autocomplete="off"
        >

      </div>


      <!-- توضيح الألوان -->

      <div class="legend">

        <span>
          <i class="red"></i>
          مطلوب
        </span>

        <span>
          <i class="green"></i>
          دائن
        </span>

        <span>
          <i class="gray"></i>
          مسدد
        </span>

      </div>


      <!-- الأشخاص -->

      <div id="peopleList" class="people-list"></div>

    </main>

  </section>


  <!-- ================= PERSON DETAILS ================= -->

  <div
    id="personDetails"
    class="details-overlay hidden"
  ></div>


  <!-- ================= PERSON MODAL ================= -->

  <div
    id="personModal"
    class="modal-container hidden"
  ></div>


  <!-- ================= TRANSACTION MODAL ================= -->

  <div
    id="transactionModal"
    class="modal-container hidden"
  ></div>


  <!-- ================= TOAST ================= -->

  <div
    id="toast"
    class="toast hidden"
  ></div>


  <!-- ================= APP ================= -->

  <script src="app.js?v=31"></script>

</body>
</html>
