<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
    initial-scale=1,
    maximum-scale=1,
    user-scalable=no"
  >

  <title>دفتر الديون</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>
  <script defer src="app.js"></script>
</head>

<body>

  <!-- LOADING -->

  <div id="loadingScreen" class="loading-screen">
    <div class="loader"></div>
    <h2>دفتر الديون</h2>
    <p>جارٍ التحميل...</p>
  </div>


  <!-- LOGIN -->

  <section id="loginPage" class="page hidden">

    <div class="login-card">

      <div class="logo">
        <span>💰</span>
      </div>

      <h1>دفتر الديون</h1>

      <p class="subtitle">
        تسجيل الدخول
      </p>

      <form id="loginForm">

        <label>
          البريد الإلكتروني
        </label>

        <input
          id="loginEmail"
          type="email"
          placeholder="example@email.com"
          required
          autocomplete="username"
        >

        <label>
          كلمة المرور
        </label>

        <input
          id="loginPassword"
          type="password"
          placeholder="كلمة المرور"
          required
          autocomplete="current-password"
        >

        <button
          id="loginBtn"
          type="submit"
          class="btn primary full"
        >
          تسجيل الدخول
        </button>

      </form>

      <div id="loginMessage"></div>

    </div>

  </section>


  <!-- ADMIN -->

  <section id="adminPage" class="page hidden">

    <header class="topbar">

      <div>
        <h2>لوحة الإدارة</h2>
        <span id="adminEmail"></span>
      </div>

      <button
        id="adminLogoutBtn"
        class="btn danger"
      >
        خروج
      </button>

    </header>


    <main class="container">

      <div class="page-title">

        <div>
          <h1>المكاتب</h1>
          <p>إدارة حسابات المكاتب</p>
        </div>

        <button
          id="openOfficeModalBtn"
          class="btn primary"
        >
          + إنشاء مكتب
        </button>

      </div>


      <div id="officesList" class="cards"></div>

    </main>

  </section>


  <!-- OFFICE -->

  <section id="officePage" class="page hidden">

    <header class="topbar">

      <div>

        <h2 id="officeName">
          المكتب
        </h2>

        <span id="contractStatus"></span>

      </div>

      <button
        id="officeLogoutBtn"
        class="btn danger"
      >
        خروج
      </button>

    </header>


    <main class="container">

      <div class="stats">

        <div class="stat">
          <span>عدد الأشخاص</span>
          <strong id="peopleCount">0</strong>
        </div>

        <div class="stat debt">
          <span>إجمالي المديونيات</span>
          <strong id="totalDebt">0</strong>
        </div>

        <div class="stat credit">
          <span>إجمالي الديون لنا</span>
          <strong id="totalCredit">0</strong>
        </div>

      </div>


      <div class="toolbar">

        <input
          id="searchPeople"
          type="search"
          placeholder="🔎 بحث عن شخص..."
        >

        <button
          id="openPersonModalBtn"
          class="btn primary"
        >
          + إضافة شخص
        </button>

      </div>


      <div id="peopleList" class="people-list"></div>

    </main>

  </section>


  <!-- OFFICE MODAL -->

  <div
    id="officeModal"
    class="modal hidden"
  >

    <div class="modal-box">

      <div class="modal-head">

        <h2>إنشاء مكتب</h2>

        <button
          class="close"
          data-close="officeModal"
        >
          ×
        </button>

      </div>


      <form id="officeForm">

        <label>اسم المكتب</label>

        <input
          id="officeNameInput"
          required
          placeholder="اسم المكتب"
        >


        <label>البريد الإلكتروني</label>

        <input
          id="officeEmailInput"
          type="email"
          required
          placeholder="office@email.com"
        >


        <label>كلمة المرور</label>

        <input
          id="officePasswordInput"
          type="password"
          required
          minlength="6"
          placeholder="كلمة المرور"
        >


        <label>رقم الهاتف</label>

        <input
          id="officePhoneInput"
          placeholder="رقم الهاتف"
        >


        <label>بداية العقد</label>

        <input
          id="contractStartInput"
          type="date"
        >


        <label>نهاية العقد</label>

        <input
          id="contractEndInput"
          type="date"
        >


        <label class="checkbox-row">

          <input
            id="officeActiveInput"
            type="checkbox"
            checked
          >

          المكتب فعال

        </label>


        <button
          id="saveOfficeBtn"
          class="btn primary full"
          type="submit"
        >
          إنشاء المكتب
        </button>

      </form>

      <div id="officeMessage"></div>

    </div>

  </div>


  <!-- PERSON MODAL -->

  <div
    id="personModal"
    class="modal hidden"
  >

    <div class="modal-box">

      <div class="modal-head">

        <h2 id="personModalTitle">
          إضافة شخص
        </h2>

        <button
          class="close"
          data-close="personModal"
        >
          ×
        </button>

      </div>


      <form id="personForm">

        <input
          type="hidden"
          id="personId"
        >


        <label>اسم الشخص</label>

        <input
          id="personName"
          required
          placeholder="اسم الشخص"
        >


        <label>رقم الهاتف</label>

        <input
          id="personPhone"
          placeholder="رقم الهاتف"
        >


        <label>نوع الحساب</label>

        <div class="type-buttons">

          <button
            type="button"
            class="type-btn active debt-type"
            data-type="debt"
          >
            مديون لنا
          </button>

          <button
            type="button"
            class="type-btn credit-type"
            data-type="credit"
          >
            نحن مديونون له
          </button>

        </div>


        <input
          type="hidden"
          id="personType"
          value="debt"
        >


        <label>المبلغ</label>

        <input
          id="personAmount"
          type="number"
          min="0"
          step="0.01"
          required
          placeholder="0"
        >


        <label>التاريخ</label>

        <input
          id="personDate"
          type="date"
          required
        >


        <label>ملاحظات</label>

        <textarea
          id="personNotes"
          rows="3"
          placeholder="ملاحظات اختيارية"
        ></textarea>


        <button
          type="submit"
          class="btn primary full"
        >
          حفظ
        </button>

      </form>

      <div id="personMessage"></div>

    </div>

  </div>


  <!-- PERSON DETAILS -->

  <div
    id="detailsModal"
    class="modal hidden"
  >

    <div class="modal-box">

      <div class="modal-head">

        <h2 id="detailsName">
          تفاصيل الشخص
        </h2>

        <button
          class="close"
          data-close="detailsModal"
        >
          ×
        </button>

      </div>

      <div id="detailsContent"></div>

    </div>

  </div>


</body>
</html>
